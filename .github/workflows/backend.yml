name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  worker-unit:
    name: Worker unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: "backend/worker/uv.lock"
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Run unit tests
        run: uv run --frozen python -m unittest discover -s tests -t . -v

  integration:
    name: Go API and worker integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/api/go.mod
          cache-dependency-path: backend/api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: "backend/worker/uv.lock"

      - name: Go unit tests
        working-directory: backend/api
        run: go test ./...

      - name: Build Go API
        working-directory: backend/api
        run: |
          go build -trimpath -o "$RUNNER_TEMP/taiga-sleep-api" .
          echo "POCKETBASE_BIN=$RUNNER_TEMP/taiga-sleep-api" >> "$GITHUB_ENV"

      - name: Sync worker environment
        run: uv sync --project worker --frozen

      - name: Run integration tests
        run: uv run --project worker --frozen python -m unittest tests.test_integration -v
