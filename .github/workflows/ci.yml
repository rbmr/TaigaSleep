name: ci

# Everything that has to pass before a merge runs here, and `gate` is the one
# required check besides the version checks. The gate always runs and is green
# only when every job that applies to the change succeeded: a job skipped
# because its area did not change is a legitimate skip, anything else is a
# failure. tools/ci_areas.py decides which areas a change touches, so a
# documentation pull request runs no build job and still gets a green gate.
#
# Every other job is gated on one area, so no job both applies and stays
# pending. Checks that apply to the whole repository (the workflow lint) always
# run.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.areas.outputs.app }}
      go: ${{ steps.areas.outputs.go }}
      worker: ${{ steps.areas.outputs.worker }}
      python: ${{ steps.areas.outputs.python }}
      integration: ${{ steps.areas.outputs.integration }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Work out which checks this change needs
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          args=(--head HEAD)
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            args+=(--base "origin/$BASE_REF")
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            args+=(--base "$BEFORE")
          fi
          # Without a comparison the script runs every area, which is the safe
          # direction: a merge validates the whole tree.
          python3 tools/ci_areas.py "${args[@]}" --github-output "$GITHUB_OUTPUT"

  app:
    name: App tests and Android lint
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run unit tests and build the debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Run Android lint
        run: ./gradlew :app:lintDebug

      - name: Upload the unit test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

  kotlin:
    name: Kotlin static analysis
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      # The findings that predate the check are in tools/detekt/baseline.xml.
      - name: Run detekt
        run: ./tools/check_kotlin.sh

  go-tests:
    name: Go tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/api/go.mod
          cache-dependency-path: backend/api/go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run the unit tests
        run: go test -count=1 ./...

  go-analysis:
    name: Go static analysis
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/api/go.mod
          cache-dependency-path: backend/api/go.sum

      - name: Put the installed tools on the path
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.2

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run govulncheck
        run: govulncheck ./...

  worker-tests:
    name: Worker tests
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: "backend/worker/uv.lock"

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Run the unit tests
        run: uv run --frozen pytest

  python-lint:
    name: Python lint
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: "backend/worker/uv.lock"

      - name: Sync locked dependencies
        run: uv sync --project backend/worker --frozen

      # ruff comes from the worker's dev dependencies and reads tools/ruff.toml,
      # which covers the worker and tools/.
      - name: Run ruff check
        run: |
          uv run --project backend/worker --frozen ruff check --config tools/ruff.toml \
            backend/worker tools

      - name: Run ruff format --check
        run: |
          uv run --project backend/worker --frozen ruff format --check \
            --config tools/ruff.toml backend/worker tools

  integration:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/api/go.mod
          cache-dependency-path: backend/api/go.sum

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: "backend/worker/uv.lock"

      - name: Build the Go API
        working-directory: backend/api
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/taiga-sleep-api" .
          echo "POCKETBASE_BIN=$RUNNER_TEMP/taiga-sleep-api" >> "$GITHUB_ENV"

      - name: Sync the worker environment
        run: uv sync --project worker --frozen

      - name: Run the integration tests
        run: uv run --project worker --frozen pytest tests/test_integration.py -v

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "$base/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/checksums.txt" \
            "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" \
            && grep " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz$" checksums.txt \
            | sha256sum --check --status)
          tar -xzf "$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint the workflows and their scripts
        run: actionlint

  gate:
    name: gate
    needs:
      - changes
      - app
      - kotlin
      - go-tests
      - go-analysis
      - worker-tests
      - python-lint
      - integration
      - workflows
    # Always runs, so a failure upstream leaves a red gate instead of a required
    # check that never reported.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every job that applies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          failed = []
          for name, job in needs.items():
              result = job["result"]
              print(f"{name}: {result}")
              # Changes has to report: when it fails every other job skips, and a
              # skipped job is otherwise indistinguishable from a path filter.
              if name == "changes":
                  ok = result == "success"
              else:
                  ok = result in ("success", "skipped")
              if not ok:
                  failed.append(f"{name}: {result}")

          if failed:
              print("the gate is red because:", file=sys.stderr)
              for line in failed:
                  print(f"  {line}", file=sys.stderr)
              sys.exit(1)

          print("every job that applies succeeded, the rest were skipped by their area")
          PY
