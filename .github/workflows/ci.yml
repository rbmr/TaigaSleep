name: ci

# Everything that has to pass before a merge runs here, and `gate` is the one
# required check besides the version checks. The gate always runs and is green
# only when every job that applies to the change succeeded: a job skipped
# because its area did not change is a legitimate skip, anything else is a
# failure. tools/ci_areas.py decides which areas a change touches, so a
# documentation pull request runs no build job and still gets a green gate.
#
# Every job is gated on one area, so no job both applies and stays pending.
# Checks that apply to the whole repository (the workflow lint) always run.
# The longest job (the app) is declared first so it starts as early as the
# runner queue allows.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      app: ${{ steps.areas.outputs.app }}
      go: ${{ steps.areas.outputs.go }}
      worker: ${{ steps.areas.outputs.worker }}
      python: ${{ steps.areas.outputs.python }}
      integration: ${{ steps.areas.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Work out which checks this change needs
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          args=(--head HEAD)
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            args+=(--base "origin/$BASE_REF")
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            args+=(--base "$BEFORE")
          fi
          # Without a comparison the script runs every area, which is the safe
          # direction: a merge validates the whole tree.
          python3 tools/ci_areas.py "${args[@]}" --github-output "$GITHUB_OUTPUT"

  app-tests:
    name: App unit tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The unit test classes run in four JVMs (`maxParallelForks`). Nothing here needs
      # the APK. See docs/ci.md.
      - name: Run the unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload the unit test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

  app-lint:
    name: Android lint
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Lint reads sources and compiled classes; it does not need the APK.
      - name: Run Android lint
        run: ./gradlew :app:lintDebug

      - name: Upload the lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  app-build:
    name: App build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Packaging catches what neither tests nor lint do (dex merging, manifest merging).
      # Nothing else waits for it.
      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug

  kotlin:
    name: Kotlin static analysis
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # The findings that predate the check are in tools/detekt/baseline.xml.
      - name: Run detekt
        run: ./tools/check_kotlin.sh

  go-tests:
    name: Go tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/api/go.mod
          cache-dependency-path: backend/api/go.sum

      - name: Run go vet
        run: go vet ./...

      # One process per package, packages side by side (`-p` defaults to the
      # runner's core count). The API's tests that share no state call
      # t.Parallel(), so the largest package runs several tests at once too.
      - name: Run the unit tests
        run: go test -count=1 ./...

  go-analysis:
    name: Go static analysis
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/api/go.mod
          cache-dependency-path: backend/api/go.sum

      - name: Put the installed tools on the path
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.2

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run govulncheck
        run: govulncheck ./...

  worker-tests:
    name: Worker tests
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: "backend/worker/uv.lock"

      - name: Sync locked dependencies
        run: uv sync --frozen

      # Four workers, matching the runner's cores. tests/test_realtime.py drives
      # real sockets and timers, so it runs on its own afterwards instead of
      # beside the rest: running it under load is what makes it flaky.
      - name: Run the unit tests
        run: uv run --frozen pytest -n 4 --ignore tests/test_realtime.py

      - name: Run the realtime tests
        run: uv run --frozen pytest tests/test_realtime.py

  python-lint:
    name: Python lint
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: "backend/worker/uv.lock"

      - name: Sync locked dependencies
        run: uv sync --project backend/worker --frozen

      # ruff comes from the worker's dev dependencies and reads tools/ruff.toml,
      # which covers the worker and tools/.
      - name: Run ruff check
        run: |
          uv run --project backend/worker --frozen ruff check --config tools/ruff.toml \
            backend/worker tools

      - name: Run ruff format --check
        run: |
          uv run --project backend/worker --frozen ruff format --check \
            --config tools/ruff.toml backend/worker tools

  integration:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/api/go.mod
          cache-dependency-path: backend/api/go.sum

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.7"
          enable-cache: true
          cache-dependency-glob: "backend/worker/uv.lock"

      - name: Build the Go API
        working-directory: backend/api
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/taiga-sleep-api" .
          echo "POCKETBASE_BIN=$RUNNER_TEMP/taiga-sleep-api" >> "$GITHUB_ENV"

      - name: Sync the worker environment
        run: uv sync --project worker --frozen

      # Every pytest worker is a separate process, so the session fixture starts
      # its own API server on an OS-assigned port with its own data directory
      # and worker processes. Tests share one server only within a worker, where
      # they still run one after the other.
      - name: Run the integration tests in four workers
        run: uv run --project worker --frozen pytest -n 4 tests/test_integration.py

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "$base/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/checksums.txt" \
            "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" \
            && grep " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz$" checksums.txt \
            | sha256sum --check --status)
          tar -xzf "$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint the workflows and their scripts
        run: actionlint

  gate:
    name: gate
    needs:
      - changes
      - app-tests
      - app-lint
      - app-build
      - kotlin
      - go-tests
      - go-analysis
      - worker-tests
      - python-lint
      - integration
      - workflows
    # Always runs, so a failure upstream leaves a red gate instead of a required
    # check that never reported.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check every job that applies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          failed = []
          for name, job in needs.items():
              result = job["result"]
              print(f"{name}: {result}")
              # Changes has to report: when it fails every other job skips, and a
              # skipped job is otherwise indistinguishable from a path filter.
              if name == "changes":
                  ok = result == "success"
              else:
                  ok = result in ("success", "skipped")
              if not ok:
                  failed.append(f"{name}: {result}")

          if failed:
              print("the gate is red because:", file=sys.stderr)
              for line in failed:
                  print(f"  {line}", file=sys.stderr)
              sys.exit(1)

          print("every job that applies succeeded, the rest were skipped by their area")
          PY
