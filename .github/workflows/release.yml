name: release

# One rolling release, overwritten on every push to main. There are no version
# numbers or tags yet; proper versioning is tracked in #13.
#
# Run this workflow manually on a branch to check the build and signing steps
# without publishing anything: the images are built but not pushed, and the
# release job is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  app:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          TAIGA_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          TAIGA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAIGA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAIGA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify the APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::no signed release APK was produced; check the signing secrets"
            exit 1
          fi
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --print-certs "$apk"
          badging=$("$build_tools/aapt" dump badging "$apk")
          echo "$badging" | grep -E '^package:'
          if ! echo "$badging" | grep -q "name='com.rbmr.taigasleep'"; then
            echo "::error::release APK does not use the production package name"
            exit 1
          fi
          if echo "$badging" | grep -q 'application-debuggable'; then
            echo "::error::release APK is debuggable"
            exit 1
          fi

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/taiga-sleep.apk
          (cd dist && sha256sum taiga-sleep.apk > taiga-sleep.apk.sha256)
          cat dist/taiga-sleep.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/
          if-no-files-found: error

  backend:
    name: Backend images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: taigasleep-api
            context: backend/api
          - name: taigasleep-worker
            context: backend/worker
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}:latest"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$image" \
            "${{ matrix.context }}"

      - name: Push image
        if: github.event_name == 'push'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}:latest"
          printf '%s' "$REGISTRY_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image"

  publish:
    name: Publish latest release
    needs: [app, backend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist

      - name: Replace the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=latest
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          cat > notes.md <<EOF
          Rolling build of \`main\` at \`${GITHUB_SHA::12}\`.

          - Release app: \`com.rbmr.taigasleep\`
          - Debug app: \`com.rbmr.taigasleep.debug\`
          - Backend images: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/taigasleep-api:latest\` and \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/taigasleep-worker:latest\`

          This release is replaced on every push to \`main\`. There are no per-change
          version numbers or changelog yet; see #13.
          EOF
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes-file notes.md \
            --latest \
            dist/taiga-sleep.apk \
            dist/taiga-sleep.apk.sha256
