name: release

# One release per component whose version changed: app-v<version> carries the
# signed APK, backend-v<version> marks the images built from the same commit. A
# backend-only merge never rebuilds the APK, and an app-only merge never
# republishes the images. tools/release_plan.py makes that decision; the same
# script runs on every pull request so a broken merge fails its checks instead of
# main. See docs/versioning.md.
#
# Run this workflow manually on a branch to exercise both builds without
# publishing anything: the images are built but not pushed, and no tag or release
# is created.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Releases are serialised and never cancelled: a cancelled run could leave a tag
# without its assets. Each run publishes only its own versions.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.versions.outputs.app_version }}
      backend_version: ${{ steps.versions.outputs.backend_version }}
      app_release: ${{ steps.versions.outputs.app_release }}
      backend_release: ${{ steps.versions.outputs.backend_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # The same decision runs as a check on every pull request, so a green pull
      # request is a merge whose release will succeed. A missing tag publishes,
      # an unchanged component is skipped, and a reused version fails the run.
      - name: Plan the release
        id: versions
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            # A manual run builds both tracks and publishes nothing.
            python3 tools/release_plan.py --force-both --github-output "$GITHUB_OUTPUT"
          else
            python3 tools/release_plan.py --base "$BEFORE" --github-output "$GITHUB_OUTPUT"
          fi

  app:
    name: App release
    needs: plan
    if: needs.plan.outputs.app_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.app_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          TAIGA_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          TAIGA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAIGA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAIGA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify the APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::no signed release APK was produced; check the signing secrets"
            exit 1
          fi
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --print-certs "$apk"
          badging=$("$build_tools/aapt" dump badging "$apk")
          echo "$badging" | grep -E '^package:'
          if ! echo "$badging" | grep -q "name='com.rbmr.taigasleep'"; then
            echo "::error::release APK does not use the production package name"
            exit 1
          fi
          if echo "$badging" | grep -q 'application-debuggable'; then
            echo "::error::release APK is debuggable"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$VERSION"
          expected=$((major * 1000000 + minor * 1000 + patch))
          if ! echo "$badging" | grep -q "versionName='$VERSION'"; then
            echo "::error::release APK does not carry versionName $VERSION"
            exit 1
          fi
          if ! echo "$badging" | grep -q "versionCode='$expected'"; then
            echo "::error::release APK does not carry versionCode $expected"
            exit 1
          fi

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/taiga-sleep.apk
          (cd dist && sha256sum taiga-sleep.apk > taiga-sleep.apk.sha256)
          cat dist/taiga-sleep.apk.sha256

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "app-v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "App v$VERSION" \
            --generate-notes \
            --latest \
            dist/taiga-sleep.apk \
            dist/taiga-sleep.apk.sha256

  backend:
    name: Backend images
    needs: plan
    if: needs.plan.outputs.backend_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.backend_version }}
    strategy:
      # Both images are built even if one fails: the failing one names itself in
      # the check, and the digests are resolved once both have been pushed.
      fail-fast: false
      matrix:
        include:
          - name: taigasleep-api
            context: backend/api
          - name: taigasleep-worker
            context: backend/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Log in to the container registry
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The build cache is shared per image, so a rebuild after a merge that does
      # not touch a component's Dockerfile or dependencies reuses its layers.
      # Provenance and the SBOM are attestations in the pushed image index.
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:v${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          push: ${{ github.event_name == 'push' }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Report the pushed image
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          echo "$IMAGE@${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "$IMAGE:v$VERSION"

  publish-backend:
    name: Publish backend release
    needs: [plan, backend]
    # Never marked latest: releases/latest stays the newest app release, so the
    # APK download link keeps working.
    if: github.event_name == 'push' && needs.plan.outputs.backend_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.backend_version }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The digests are what a deployment should pin: they name the exact image
      # indexes, with their attestations, that this release pushed.
      - name: Resolve the pushed digests
        id: digests
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          for name in taigasleep-api taigasleep-worker; do
            image="ghcr.io/$owner/$name:v$VERSION"
            digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')
            echo "$name: $image@$digest"
            echo "${name#taigasleep-}=$image@$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          API_IMAGE: ${{ steps.digests.outputs.api }}
          WORKER_IMAGE: ${{ steps.digests.outputs.worker }}
        run: |
          set -euo pipefail
          tag="backend-v$VERSION"
          # The generated notes stay; the digests this run pushed are appended,
          # because the tag alone does not say which image was built.
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$tag" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "## Container images"
            echo
            echo "| Image | Digest |"
            echo "| --- | --- |"
            echo "| \`taigasleep-api\` | \`$API_IMAGE\` |"
            echo "| \`taigasleep-worker\` | \`$WORKER_IMAGE\` |"
            echo
            echo "Both are tagged \`v$VERSION\` and \`latest\`. Each image index carries an"
            echo "SBOM and a provenance attestation, which \`docker buildx imagetools inspect\`"
            echo "lists for the digest above."
          } >> "$RUNNER_TEMP/notes.md"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Backend v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
