name: release

# One release per component whose version changed: app-v<version> carries the
# signed APK, backend-v<version> marks the images built from the same commit. A
# backend-only merge never rebuilds the APK, and an app-only merge never
# republishes the images. tools/release_plan.py makes that decision; the same
# script runs on every pull request so a broken merge fails its checks instead of
# main. See docs/versioning.md.
#
# Run this workflow manually on a branch to exercise both builds without
# publishing anything: the images are built but not pushed, and no tag or release
# is created.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Releases are serialised and never cancelled: a cancelled run could leave a tag
# without its assets. Each run publishes only its own versions.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.versions.outputs.app_version }}
      backend_version: ${{ steps.versions.outputs.backend_version }}
      app_release: ${{ steps.versions.outputs.app_release }}
      backend_release: ${{ steps.versions.outputs.backend_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # The same decision runs as a check on every pull request, so a green pull
      # request is a merge whose release will succeed. A missing tag publishes,
      # an unchanged component is skipped, and a reused version fails the run.
      - name: Plan the release
        id: versions
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            # A manual run builds both tracks and publishes nothing.
            python3 tools/release_plan.py --force-both --github-output "$GITHUB_OUTPUT"
          else
            python3 tools/release_plan.py --base "$BEFORE" --github-output "$GITHUB_OUTPUT"
          fi

  app:
    name: App release
    needs: plan
    if: needs.plan.outputs.app_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          TAIGA_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          TAIGA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAIGA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAIGA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify the APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::no signed release APK was produced; check the signing secrets"
            exit 1
          fi
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --print-certs "$apk"
          badging=$("$build_tools/aapt" dump badging "$apk")
          echo "$badging" | grep -E '^package:'
          if ! echo "$badging" | grep -q "name='com.rbmr.taigasleep'"; then
            echo "::error::release APK does not use the production package name"
            exit 1
          fi
          if echo "$badging" | grep -q 'application-debuggable'; then
            echo "::error::release APK is debuggable"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$VERSION"
          expected=$((major * 1000000 + minor * 1000 + patch))
          if ! echo "$badging" | grep -q "versionName='$VERSION'"; then
            echo "::error::release APK does not carry versionName $VERSION"
            exit 1
          fi
          if ! echo "$badging" | grep -q "versionCode='$expected'"; then
            echo "::error::release APK does not carry versionCode $expected"
            exit 1
          fi

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/taiga-sleep.apk
          (cd dist && sha256sum taiga-sleep.apk > taiga-sleep.apk.sha256)
          cat dist/taiga-sleep.apk.sha256

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "app-v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "App v$VERSION" \
            --generate-notes \
            --latest \
            dist/taiga-sleep.apk \
            dist/taiga-sleep.apk.sha256

  backend:
    name: Backend images
    needs: plan
    if: needs.plan.outputs.backend_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.backend_version }}
    strategy:
      matrix:
        include:
          - name: taigasleep-api
            context: backend/api
          - name: taigasleep-worker
            context: backend/worker
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$image:build" \
            "${{ matrix.context }}"

      - name: Push images
        if: github.event_name == 'push'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}"
          printf '%s' "$REGISTRY_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # The immutable tag is what a deployment should pin; latest always
          # points at the newest backend build.
          docker tag "$image:build" "$image:v$VERSION"
          docker tag "$image:build" "$image:latest"
          docker push "$image:v$VERSION"
          docker push "$image:latest"

  publish-backend:
    name: Publish backend release
    needs: [plan, backend]
    # Never marked latest: releases/latest stays the newest app release, so the
    # APK download link keeps working.
    if: github.event_name == 'push' && needs.plan.outputs.backend_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.backend_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "backend-v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Backend v$VERSION" \
            --generate-notes
