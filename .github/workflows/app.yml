name: app

# App unit tests, including ArchitectureTest, run on every pull request that can
# change the app or the package table it enforces. #52 owned this before; it now
# runs here instead of only after a merge in release.yml.

on:
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "**/*.gradle.kts"
      - "docs/architecture.md"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "**/*.gradle.kts"
      - "docs/architecture.md"
      - ".github/workflows/app.yml"

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: App unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build the debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Upload the unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7
