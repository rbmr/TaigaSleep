name: taiga-sleep

services:
  api:
    # Published on every push to main; `build` lets you build from source
    # instead. Use `docker compose pull` for the published image.
    image: ghcr.io/rbmr/taigasleep-api:latest
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Bind to loopback by default. Put Caddy/nginx in front to expose only
      # /v1/* and keep the dashboard private. Set TAIGA_BIND_ADDR=0.0.0.0 to
      # expose PocketBase directly (including /_/).
      - "${TAIGA_BIND_ADDR:-127.0.0.1}:${TAIGA_PORT:-8090}:8090"
    volumes:
      - taiga-data:/pb/pb_data
    environment:
      TAIGA_HTTP_ADDR: "0.0.0.0:8090"
      # Caddy in front sets X-Forwarded-For with the client's address. The API trusts
      # no proxy header unless one is named here; set the value empty when the port is
      # exposed directly instead of through Caddy.
      TAIGA_TRUSTED_PROXY_HEADERS: "${TAIGA_TRUSTED_PROXY_HEADERS-X-Forwarded-For}"
      TAIGA_JOB_LEASE_S: "${TAIGA_JOB_LEASE_S:-1800}"
      TAIGA_JOB_MAX_ATTEMPTS: "${TAIGA_JOB_MAX_ATTEMPTS:-3}"
      # Optional bootstrap, only needed on the first start.
      TAIGA_ADMIN_EMAIL: "${TAIGA_ADMIN_EMAIL:-}"
      TAIGA_ADMIN_PASSWORD: "${TAIGA_ADMIN_PASSWORD:-}"
      TAIGA_ENCRYPTION_KEY: "${TAIGA_ENCRYPTION_KEY:-}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    image: ghcr.io/rbmr/taigasleep-worker:latest
    build:
      context: ../worker
      args:
        # The default image contains the wav2sleep stager, CPU-only PyTorch and
        # the pinned checkpoint. Set false to build the baseline-only image on a
        # host below the memory or disk requirement in backend/README.md.
        WITH_WAV2SLEEP: "${WITH_WAV2SLEEP:-true}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # The analysis subprocess has its own address-space limit (TAIGA_JOB_MEMORY_MB,
    # 2048 MB here). The container limit stays at least 512 MB above it, so a job
    # that outgrows its limit fails cleanly and is reported while the container
    # keeps running. wav2sleep peaks around 0.75 GB of RSS on a 10 h night, which
    # leaves room for the supervisor, the torch import and page cache. See
    # backend/README.md.
    mem_limit: "${TAIGA_WORKER_MEMORY:-2.5g}"
    environment:
      TAIGA_API_URL: "http://api:8090"
      TAIGA_WORKER_EMAIL: "${TAIGA_WORKER_EMAIL:-}"
      TAIGA_WORKER_PASSWORD: "${TAIGA_WORKER_PASSWORD:-}"
      TAIGA_WORKER_ID: "${TAIGA_WORKER_ID:-docker-worker}"
      TAIGA_POLL_INTERVAL_S: "${TAIGA_POLL_INTERVAL_S:-60}"
      TAIGA_JOB_LEASE_S: "${TAIGA_JOB_LEASE_S:-1800}"
      TAIGA_JOB_MEMORY_MB: "${TAIGA_JOB_MEMORY_MB:-2048}"
      TAIGA_JOB_TIMEOUT_S: "${TAIGA_JOB_TIMEOUT_S:-3600}"
      TAIGA_LOG_LEVEL: "${TAIGA_LOG_LEVEL:-INFO}"
      TAIGA_ALGORITHMS: "${TAIGA_ALGORITHMS:-}"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
    stop_grace_period: 30s

volumes:
  taiga-data:
