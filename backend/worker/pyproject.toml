[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taiga-sleep-worker"
version = "0.1.0"
description = "Taiga Sleep analysis worker supervisor"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# Opt-in ML stager. The base worker (and its Docker image) stays small and
# does not install torch, wav2sleep or a model checkpoint.
wav2sleep = [
    "torch>=2.7.1",
    "wav2sleep @ git+https://github.com/joncarter1/wav2sleep@278e30463c8149c4e6899b8784da492fec695bd9 ; python_version >= '3.11'",
]

[project.scripts]
taiga-worker = "taiga_worker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["taiga_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
