[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taiga-sleep-worker"
version = "0.1.0"
description = "Taiga Sleep analysis worker supervisor"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.scripts]
taiga-worker = "taiga_worker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
include = ["taiga_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
