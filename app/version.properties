# The app release version. This is the only place it is written: Gradle derives
# versionName and versionCode from it. Bump it on every pull request that
# changes the app.
#
# Every part stays below 1000, because the derived versionCode is
# major * 1_000_000 + minor * 1_000 + patch. Gradle refuses to build otherwise.
version=0.6.6

# The backend contract revision this app speaks. Must equal the "api" value in
# backend/version.properties. See docs/versioning.md.
requires_api=3
