org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP hands the sources it generates to the build through the Kotlin source sets, which the built-in
# Kotlin support of AGP 9 refuses by default; Room's generated database code is compiled from there.
android.disallowKotlinSourceSets=false
