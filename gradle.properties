org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Independent tasks in one invocation run side by side, and task outputs are
# cached: a re-run, and the app jobs on later runs, reuse compilation and test
# results instead of repeating the work. See docs/ci.md.
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP hands the sources it generates to the build through the Kotlin source sets, which the built-in
# Kotlin support of AGP 9 refuses by default; Room's generated database code is compiled from there.
android.disallowKotlinSourceSets=false
